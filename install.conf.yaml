# Settings
- defaults:
    link:
      create: true
      relink: true
      force: true # Swap the original file
    shell:
      stdout: true
      stderr: true
      stdin: true
    brewfile:
      stdout: true
      stderr: true
      include: ["tap", "brew", "cask", "mas"]

- clean: ["~"]

- shell:
    - ["xcode-select --install || true", "Installing XCode"]
    - ["./scripts/brew-install.sh", "Installing brew"]

- link:
    ~/.zshrc: zshrc
    ~/.gitconfig: git/.gitconfig
    ~/.config/git/ignore: git/ignore
    ~/.vimrc: vim/.vimrc
    ~/.vim/bundle: vim/bundle
    ~/.editorconfig: .editorconfig
    ~/.config/brewfile/Brewfile: Brewfile
    # VS Code
    ~/Library/Application Support/Code/User/settings.json: vscode/settings.json
    ~/Library/Application Support/Code/User/keybindings.json: vscode/keybindings.json
    # AI
    ~/AGENTS.md: AGENTS.md
    ~/.config/opencode/opencode.jsonc: opencode.jsonc

- brewfile:
    file: Brewfile

- shell:
    - ./scripts/shell.sh
    - ./scripts/npm-global.sh
    - ./scripts/macos.sh
    - ["mkdir -p ~/.agents/skills", "Creating ~/.agents/skills directory"]
